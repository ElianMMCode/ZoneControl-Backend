<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="Equipo de laboratorio farmacéutico">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#d7e2ff"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#00346f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c9d8f5" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="720" height="720" fill="url(#bg)"/>

  <g opacity="0.35">
    <circle cx="90" cy="120" r="90" fill="#ffffff"/>
    <circle cx="640" cy="600" r="130" fill="#ffffff"/>
    <circle cx="620" cy="90" r="46" fill="#ffffff"/>
  </g>

  <!-- Vial izquierdo -->
  <g>
    <rect x="120" y="300" width="70" height="150" rx="16" fill="url(#glass)" stroke="#00346f" stroke-width="3"/>
    <rect x="148" y="250" width="14" height="60" fill="#00346f"/>
    <rect x="132" y="322" width="46" height="70" rx="8" fill="#00346f" opacity="0.85"/>
    <circle cx="155" cy="356" r="8" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Matraz Erlenmeyer principal -->
  <g>
    <path d="M330 520 L470 520 L440 420 C440 380 430 360 430 320 L430 220 L370 220 L370 320 C370 360 360 380 360 420 Z"
          fill="url(#glass)" stroke="#00346f" stroke-width="4"/>
    <path d="M330 520 L470 520 L446 434 C400 470 350 470 330 520 Z" fill="url(#liquid)"/>
    <ellipse cx="400" cy="520" rx="70" ry="12" fill="#00346f" opacity="0.25"/>
    <path d="M350 210 L450 210" stroke="#00346f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="400" cy="180" r="10" fill="#ffffff" stroke="#00346f" stroke-width="3"/>
    <circle cx="400" cy="178" r="4" fill="#5b9cff"/>
  </g>

  <!-- Vial derecho (jeringa) -->
  <g>
    <rect x="540" y="330" width="52" height="150" rx="14" fill="url(#glass)" stroke="#00346f" stroke-width="3"/>
    <rect x="552" y="352" width="28" height="80" rx="6" fill="#5b9cff" opacity="0.7"/>
    <rect x="540" y="460" width="52" height="20" rx="6" fill="#00346f"/>
    <path d="M566 330 L566 300" stroke="#00346f" stroke-width="10" stroke-linecap="round"/>
    <path d="M556 300 L576 300" stroke="#00346f" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Cápsulas / tabletas -->
  <g>
    <rect x="180" y="540" width="120" height="42" rx="21" fill="#ffffff" stroke="#00346f" stroke-width="3"/>
    <path d="M238 525 A 21 21 0 0 1 238 597" fill="none" stroke="#00346f" stroke-width="3"/>
    <rect x="360" y="590" width="120" height="42" rx="21" fill="#ffffff" stroke="#00346f" stroke-width="3"/>
    <path d="M418 575 A 21 21 0 0 1 418 647" fill="none" stroke="#00346f" stroke-width="3"/>
  </g>

  <!-- Burbujas -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="400" cy="470" r="10"/>
    <circle cx="424" cy="452" r="7"/>
    <circle cx="382" cy="488" r="6"/>
  </g>
</svg>
